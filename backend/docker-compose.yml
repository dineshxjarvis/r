# Local development only. Production Postgres and object storage are Supabase.
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: strata
      POSTGRES_PASSWORD: strata
      POSTGRES_DB: strata
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U strata"]
      interval: 5s
      retries: 10

  # OpenFGA keeps its own database. Never the app database.
  openfga-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: openfga
      POSTGRES_PASSWORD: openfga
      POSTGRES_DB: openfga
    volumes: ["fgadata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openfga"]
      interval: 5s
      retries: 10

  openfga-migrate:
    image: openfga/openfga:latest
    command: migrate
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
    depends_on:
      openfga-db: { condition: service_healthy }

  openfga:
    image: openfga/openfga:latest
    command: run
    environment:
      OPENFGA_DATASTORE_ENGINE: postgres
      OPENFGA_DATASTORE_URI: postgres://openfga:openfga@openfga-db:5432/openfga?sslmode=disable
      OPENFGA_LOG_FORMAT: json
    ports: ["8080:8080", "8081:8081", "3000:3000"]
    depends_on:
      openfga-migrate: { condition: service_completed_successfully }

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  # Stands in for Supabase Storage locally. Same S3 protocol.
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: strata
      MINIO_ROOT_PASSWORD: strataminio
    ports: ["9000:9000", "9001:9001"]
    volumes: ["miniodata:/data"]

volumes:
  pgdata:
  fgadata:
  miniodata:
