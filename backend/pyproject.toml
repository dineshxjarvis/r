[project]
name = "strata-backend"
version = "0.0.1"
description = "Strata — mining compliance platform API (FastAPI + PostgreSQL/PostGIS + OpenFGA)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.118.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic[email]>=2.11.0",
    "pydantic-settings>=2.8.0",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30.0",
    "alembic>=1.15.0",
    "geoalchemy2>=0.17.0",
    "shapely>=2.1.0",
    "openfga-sdk>=0.9.0",
    "redis[hiredis]>=5.2.0",
    "arq>=0.26.0",
    "aioboto3>=14.0.0",
    "python-ulid>=3.0.0",
    "structlog>=25.1.0",
    "orjson>=3.10.0",
    "httpx>=0.28.0",
    "argon2-cffi>=23.1.0",
    "pyjwt[crypto]>=2.10.0",
    "python-multipart>=0.0.20",
    "python-magic>=0.4.27",
    "psycopg[binary]>=3.2.0",  # sync driver for alembic migrations only; app uses asyncpg
]

[project.optional-dependencies]
ai = [
    "google-genai>=1.0.0",
    "groq>=0.18.0",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
    "bandit>=1.8.0",
    "vulture>=2.14",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S", "DTZ"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency injection is expressed as a call in a default
# argument. That is the framework's idiom, not the mutable-default bug B008
# exists to catch.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# Migrations execute checked-in SQL files by design; the schema is the point.
"migrations/*" = ["S608"]

[tool.pyright]
include = ["app"]
exclude = ["**/__pycache__", ".venv", "migrations/versions"]
typeCheckingMode = "standard"
pythonVersion = "3.13"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]

[tool.vulture]
paths = ["app"]
min_confidence = 80

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
